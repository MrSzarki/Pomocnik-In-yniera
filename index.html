<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pomocnik Inżyniera</title>
<meta name="description" content="Biblioteka norm i aktów prawnych oraz odbiory mieszkań z usterkami na rzutach i raportem PDF.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#172129" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
body { margin: 0; } img { max-width: 100%; } [hidden] { display: none !important; }
/* Layout: phone-first app shell — sticky title bar, scrolling content, fixed bottom tab bar; drawing-sheet details (title blocks, mono designations). */
:root {
  --paper: #eef1f0;
  --surface: #ffffff;
  --surface-2: #f6f8f7;
  --ink: #17222b;
  --muted: #5b6a72;
  --line: #d2dadb;
  --accent: #e5a019;
  --accent-ink: #2b1c00;
  --blue: #1d5d8a;
  --blue-soft: #e3eef6;
  --danger: #c23f2c;
  --danger-soft: #fbe9e6;
  --ok: #2d8653;
  --ok-soft: #e4f3ea;
  --shadow: 0 1px 2px rgba(23,34,43,.08), 0 6px 20px rgba(23,34,43,.08);
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", Roboto, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --tabh: 62px;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10171c; --surface: #172129; --surface-2: #1c2831; --ink: #e5ecee; --muted: #94a4ac;
    --line: #2a3943; --accent: #f0b33a; --accent-ink: #241700; --blue: #72b4e2; --blue-soft: #18303f;
    --danger: #ee6c58; --danger-soft: #3a1f1b; --ok: #5cc489; --ok-soft: #173326;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10171c; --surface: #172129; --surface-2: #1c2831; --ink: #e5ecee; --muted: #94a4ac;
  --line: #2a3943; --accent: #f0b33a; --accent-ink: #241700; --blue: #72b4e2; --blue-soft: #18303f;
  --danger: #ee6c58; --danger-soft: #3a1f1b; --ok: #5cc489; --ok-soft: #173326;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 16px/1.45 var(--body); -webkit-tap-highlight-color: transparent; }
body.locked { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
a { color: var(--blue); }

.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 880px; margin: 0 auto; }
#main { padding-bottom: calc(var(--tabh) + env(safe-area-inset-bottom, 0px) + 24px); }

/* Top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar .inner { display: flex; align-items: center; gap: 10px; min-height: 58px; padding-block: 8px; }
.bar h1 { font: 700 24px/1.05 var(--display); letter-spacing: .01em; margin: 0; text-wrap: balance; }
.bar .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.bar .grow { flex: 1; min-width: 0; }
.bar .grow > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mark { width: 34px; height: 34px; flex: none; border-radius: 8px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font: 700 15px var(--mono); }

.iconbtn { width: 42px; height: 42px; flex: none; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.iconbtn svg { width: 22px; height: 22px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Search */
.search { position: relative; margin-block: 14px 6px; }
.search input { width: 100%; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 44px 0 44px; font-size: 16px; }
.search svg { position: absolute; left: 13px; top: 13px; width: 22px; height: 22px; color: var(--muted); }
.search .clear { position: absolute; right: 4px; top: 4px; border: 0; background: none; width: 40px; height: 40px; color: var(--muted); font-size: 22px; }

.crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 14px; color: var(--muted); margin: 12px 0 6px; }
.crumbs button { border: 0; background: none; padding: 4px 2px; color: var(--blue); font-weight: 600; }
.crumbs .cur { color: var(--ink); font-weight: 600; }

.label { font: 600 12px var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }

.list { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border: 0; text-align: left; width: 100%; min-height: 60px; }
.item:active { background: var(--surface-2); }
.item .body { flex: 1; min-width: 0; }
.item .t { font-weight: 600; line-height: 1.25; }
.item .m { font-size: 13px; color: var(--muted); margin-top: 2px; }
.item .chev { color: var(--muted); flex: none; }
.folder { width: 38px; height: 38px; border-radius: 9px; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; flex: none; }
.folder svg { width: 22px; height: 22px; }
.count { font: 500 13px var(--mono); color: var(--muted); }

.type { flex: none; font: 700 10.5px var(--mono); letter-spacing: .05em; padding: 4px 6px; border-radius: 5px; border: 1.5px solid currentColor; min-width: 54px; text-align: center; }
.type.NORMA { color: var(--blue); }
.type.AKT { color: var(--ok); }
.type.WT { color: var(--accent); }
.type.ZESZYT { color: var(--danger); }
.type.INNE { color: var(--muted); }
.desig { font: 600 13.5px var(--mono); color: var(--ink); }
mark { background: color-mix(in srgb, var(--accent) 35%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
.hits { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.hits li { font-size: 13.5px; color: var(--muted); }

.empty { text-align: center; padding: 34px 20px; border: 1.5px dashed var(--line); border-radius: var(--r); color: var(--muted); background: var(--surface); }
.empty h3 { font: 600 20px var(--display); color: var(--ink); margin: 0 0 6px; }
.empty p { margin: 0 auto 16px; max-width: 42ch; }
.note { font-size: 14px; color: var(--muted); padding: 12px 14px; border-radius: var(--r); background: var(--surface-2); border: 1px solid var(--line); }
.note.warn { background: var(--danger-soft); border-color: transparent; color: var(--ink); }

/* Doc detail: drawing title block */
.titleblock { margin-top: 16px; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--surface); display: grid; grid-template-columns: 1fr auto; }
.titleblock > div { padding: 10px 14px; min-width: 0; }
.titleblock .cell-l { border-right: 1.5px solid var(--ink); }
.titleblock .k { font: 600 10.5px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.titleblock .v { font-weight: 600; }
.titleblock .big { grid-column: 1 / -1; border-top: 1.5px solid var(--ink); }
.titleblock h2 { font: 700 26px/1.12 var(--display); margin: 2px 0 0; text-wrap: balance; }
.titleblock .num { font: 700 17px var(--mono); margin-top: 2px; overflow-wrap: anywhere; }
.prose { white-space: pre-wrap; overflow-wrap: anywhere; }
.chap .no { font: 700 13px var(--mono); color: var(--blue); flex: none; min-width: 42px; }
.chap .pg { font: 500 12px var(--mono); color: var(--muted); flex: none; }

/* Tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .inner { display: grid; grid-template-columns: 1fr 1fr; height: var(--tabh); }
.tabs button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; font-weight: 600; color: var(--muted); position: relative; }
.tabs button svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--ink); }
.tabs button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }

/* Projects */
.pcards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
.pcard { text-align: left; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 14px; display: grid; gap: 10px; box-shadow: var(--shadow); }
.pcard h3 { margin: 0; font: 700 21px/1.1 var(--display); }
.pcard .m { font-size: 13.5px; color: var(--muted); }
.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { font: 600 12.5px var(--body); padding: 3px 9px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.open { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); border-color: transparent; color: var(--ink); }
.pill.done { background: var(--ok-soft); border-color: transparent; color: var(--ok); }

/* Plan viewer */
.plantabs { display: flex; gap: 8px; overflow-x: auto; padding-block: 10px; scrollbar-width: none; }
.plantabs::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 0 14px; height: 38px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip.add { border-style: dashed; color: var(--blue); }
.stagewrap { position: relative; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface-2); height: 58vh; height: 58svh; min-height: 300px; max-height: 720px; }
.stage { position: absolute; inset: 0; touch-action: none; overflow: hidden; cursor: grab; user-select: none; -webkit-user-select: none;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 24px 24px; background-position: -1px -1px; }
.stagewrap.adding .stage { cursor: crosshair; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.world img { display: block; width: 100%; height: 100%; max-width: none; pointer-events: none; background: #fff; box-shadow: 0 0 0 1px var(--line); }
.pin { position: absolute; width: 0; height: 0; }
.pin > span { position: absolute; left: -16px; top: -40px; width: 32px; height: 40px; transform: scale(var(--inv, 1)); transform-origin: 50% 100%; display: grid; justify-items: center; }
.pin b { width: 32px; height: 32px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--accent); border: 2px solid #1b1b1b; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.pin i { transform: rotate(45deg); font: 700 13px var(--mono); font-style: normal; color: #1b1b1b; }
.pin.done b { background: #3fae6c; }
.pin.ghost b { background: #fff; border-style: dashed; }
.pin.sel b { outline: 3px solid var(--blue); outline-offset: 2px; }
.tools { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: 10px; display: grid; gap: 8px; }
.tools .iconbtn { box-shadow: var(--shadow); }
.addfab { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); box-shadow: var(--shadow); }
.stagewrap.adding .addfab { background: var(--blue); border-color: var(--blue); color: #fff; }
.hint { position: absolute; left: 10px; top: 10px; right: 64px; font-size: 13.5px; font-weight: 600; background: var(--blue); color: #fff; padding: 8px 12px; border-radius: 8px; box-shadow: var(--shadow); }
.stage-empty { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; text-align: center; }
.stage-empty > div { max-width: 340px; }
.stage-empty h3 { font: 700 21px var(--display); margin: 0 0 6px; }
.stage-empty p { color: var(--muted); margin: 0 0 14px; }

.drow { display: flex; gap: 12px; align-items: center; padding: 10px 14px; background: var(--surface); border: 0; width: 100%; text-align: left; min-height: 64px; }
.dnum { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 700 13px var(--mono); background: var(--accent); color: #1b1b1b; border: 2px solid #1b1b1b; }
.dnum.done { background: #3fae6c; }
.thumb { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; flex: none; background: var(--surface-2); border: 1px solid var(--line); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 0 12px; height: 36px; font-size: 14px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* Sheets */
#sheet, #confirm, #busy { position: fixed; inset: 0; z-index: 20; }
#confirm { z-index: 30; }
#busy { z-index: 40; display: grid; place-items: center; background: rgba(10,16,20,.55); padding: 20px; }
.backdrop { position: absolute; inset: 0; background: rgba(10,16,20,.5); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 92%; overflow: auto; background: var(--surface); border-radius: 16px 16px 0 0; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); box-shadow: 0 -10px 40px rgba(0,0,0,.25); }
@media (min-width: 700px) { .sheet { left: 50%; right: auto; width: 640px; transform: translateX(-50%); bottom: 24px; border-radius: 16px; max-height: calc(100% - 48px); } }
.grab { width: 44px; height: 5px; border-radius: 9px; background: var(--line); margin: 4px auto 10px; }
.sheet h2 { font: 700 24px/1.1 var(--display); margin: 0 0 4px; }
.sheet .lead { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
.form { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; }
.field > span { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 10px 12px; font-size: 16px; }
.field textarea { min-height: 96px; resize: vertical; }
.two { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
@media (max-width: 420px) { .two { grid-template-columns: 1fr; } }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; margin-top: 6px; }
.actions .spacer { flex: 1; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.photo { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .x { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(0,0,0,.65); color: #fff; font-size: 16px; line-height: 1; }
.photo.loading { display: grid; place-items: center; font-size: 12px; color: var(--muted); }
.sheet-tb { display: grid; grid-template-columns: auto 1fr; gap: 0; border: 1.5px solid var(--ink); border-radius: 4px; margin-bottom: 14px; }
.sheet-tb > div { padding: 8px 12px; min-width: 0; }
.sheet-tb > div:first-child { border-right: 1.5px solid var(--ink); display: grid; place-items: center; }
.busybox { background: var(--surface); border-radius: 14px; padding: 22px 24px; max-width: 340px; width: 100%; text-align: center; box-shadow: var(--shadow); }
.busybox p { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
.bar-prog { height: 6px; border-radius: 9px; background: var(--line); overflow: hidden; margin-top: 14px; }
.bar-prog > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

/* PDF viewer */
#viewer { position: fixed; inset: 0; z-index: 15; background: var(--paper); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
#viewer .vbar { background: var(--surface); border-bottom: 1px solid var(--line); }
#viewer .vbar .inner { display: flex; gap: 8px; align-items: center; min-height: 56px; padding-block: 6px; }
#viewer .vt { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#viewer .pg { font: 500 13px var(--mono); color: var(--muted); white-space: nowrap; }
#vscroll { position: relative; flex: 1; overflow: auto; padding: 12px 0 calc(24px + env(safe-area-inset-bottom, 0px)); -webkit-overflow-scrolling: touch; }
.vpages { display: grid; gap: 12px; justify-items: center; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.vpage { background: #fff; box-shadow: var(--shadow); position: relative; }
.vpage canvas { display: block; width: 100%; height: 100%; }
.vpage .hlayer { position: absolute; inset: 0; pointer-events: none; }
.hl { position: absolute; background: rgba(229,160,25,.32); border-radius: 2px; }
.hl.cur { background: rgba(229,160,25,.6); box-shadow: 0 0 0 2px #b97700; }
#viewer .vsearch { background: var(--surface); border-bottom: 1px solid var(--line); }
.vs-row { display: flex; gap: 6px; align-items: center; padding-block: 8px; }
.vs-row input { flex: 1; min-width: 0; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 12px; font-size: 16px; }
.vs-row .iconbtn { width: 38px; height: 42px; font-size: 18px; }
.vs-row .iconbtn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.vs-count { font: 500 12.5px var(--mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.vs-results { max-height: 38vh; overflow: auto; border-top: 1px solid var(--line); padding-bottom: 6px; }
.vs-res { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 10px 4px; font-size: 14px; line-height: 1.35; color: var(--ink); overflow-wrap: anywhere; }
.vs-res .pgn { font: 700 12px var(--mono); color: var(--blue); margin-right: 8px; }
.vs-res[aria-current="true"] { background: var(--blue-soft); }
.vzoom { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 2; }
.vzoom .iconbtn, .vmark { box-shadow: var(--shadow); }
.vmark { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 2; }
#viewer.marking .vmark { background: var(--blue); border-color: var(--blue); color: #fff; }
.vhint { background: var(--blue); color: #fff; font-size: 14px; font-weight: 600; }
.vhint .inner { padding-block: 9px; }
#viewer.marking .vpage { touch-action: none; cursor: crosshair; outline: 2px dashed var(--blue); outline-offset: 3px; }
.selbox { position: absolute; border: 2px dashed var(--blue); background: rgba(29, 93, 138, .14); pointer-events: none; z-index: 1; }
.mk { position: absolute; border: 2px solid var(--blue); background: rgba(29, 93, 138, .10); border-radius: 3px; }
.mk.focus { border-width: 3px; background: rgba(29, 93, 138, .18); box-shadow: 0 0 0 4px rgba(29, 93, 138, .25); }
.mk span, .mk-page span { position: absolute; left: -2px; bottom: 100%; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 11px var(--body); background: #1d5d8a; color: #fff; padding: 2px 6px; border-radius: 4px 4px 0 0; }
.mk-page { position: absolute; right: 0; top: 0; width: 0; height: 0; }
.mk-page span { left: auto; right: 0; bottom: auto; top: 0; border-radius: 0 0 0 6px; }
.item.chap { padding: 0; }
.chap-go { flex: 1; min-width: 0; display: flex; gap: 12px; align-items: center; border: 0; background: none; text-align: left; color: inherit; padding: 12px 0 12px 14px; min-height: 60px; }

});

// ---------- Minimal PDF writer: one full-page JPEG per A4 page ----------
class MiniPdf {
  constructor() { this.pages = []; }
  addJpeg(bytes, w, h) { this.pages.push({ bytes, w, h }); }
  toBlob() {
    const enc = new TextEncoder(); const parts = []; const offsets = []; let pos = 0;
    const push = (x) => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); pos += b.length; };
    const obj = (num, chunks) => { offsets[num] = pos; push(num + ' 0 obj\n'); for (const c of [].concat(chunks)) push(c); push('\nendobj\n'); };
    push('%PDF-1.4\n%âãÏÓ\n');
    const n = this.pages.length; const W = 595.28, H = 841.89;
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, `<< /Type /Pages /Kids [${this.pages.map((_, i) => (3 + i * 3) + ' 0 R').join(' ')}] /Count ${n} >>`);
    this.pages.forEach((p, i) => {
      const pn = 3 + i * 3, cn = pn + 1, im = pn + 2;
      obj(pn, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im${i} ${im} 0 R >> >> /Contents ${cn} 0 R >>`);
      const content = `q ${W} 0 0 ${H} 0 0 cm /Im${i} Do Q`;
      obj(cn, `<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
      obj(im, [`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.bytes.length} >>\nstream\n`, p.bytes, '\nendstream']);
    });
    const xref = pos; const count = 3 + n * 3;
    let x = `xref\n0 ${count}\n0000000000 65535 f \n`;
    for (let k = 1; k < count; k++) x += String(offsets[k]).padStart(10, '0') + ' 00000 n \n';
    push(x); push(`trailer\n<< /Size ${count} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
    return new Blob(parts, { type: 'application/pdf' });
  }
}

// ---------- ZIP (store) writer and reader for backups ----------
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, dosTime, true); h.setUint16(12, dosDate, true); h.setUint32(14, crc, true);
    h.setUint32(18, size, true); h.setUint32(22, size, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);

    c.setUint16(12, dosTime, true); c.setUint16(14, dosDate, true); c.setUint32(16, crc, true); c.setUint32(20, size, true); c.setUint32(24, size, true);
    c.setUint16(28, name.length, true); c.setUint32(42, offset, true);

}
async function readZip(file) {

  const cd = new DataView(await file.slice(cdOff, cdOff + cdSize).arrayBuffer()); const dec = new TextDecoder(); const out = new Map(); let p = 0;
  for (let k = 0; k < count; k++) {

        const lh = new DataView(await file.slice(loff, loff + 30).arrayBuffer());
        const start = loff + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
        const raw = file.slice(start, start + csize);

}

// ---------- Local storage: IndexedDB with an in-memory mirror ----------
const COLS = { sections: 'lib_sections', docs: 'lib_docs', projects: 'projects', defects: 'defects', settings: 'settings' };
let IDB = null; const MEM = {}; const LIS = {}; const URLS = new Map();
const blobUrl = (id) => URLS.get(id) || '';
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, String(v)); } catch (e) {} };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('pomocnik-inzyniera', 1);
    r.onupgradeneeded = () => { const d = r.result; for (const c of Object.values(COLS)) d.createObjectStore(c); d.createObjectStore('assets'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function idbReq(store, mode, fn) {
  return new Promise((res, rej) => {
    let t; try { t = IDB.transaction(store, mode); } catch (e) { rej(e); return; }
    const r = fn(t.objectStore(store));
    t.oncomplete = () => res(r ? r.result : undefined);
    t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('abort'));
  });
}
async function idbEntries(store) {
  const keys = await idbReq(store, 'readonly', (s) => s.getAllKeys());
  const vals = await idbReq(store, 'readonly', (s) => s.getAll());
  return keys.map((k, i) => [k, vals[i]]);
}
const wrapErr = (e) => (e && e.name === 'QuotaExceededError') ? { code: 'quota' } : (e && e.code ? e : { code: 'local' });
function emit(col) {
  const docs = [...MEM[col].entries()].map(([id, data]) => ({ id, data: () => data }));
  (LIS[col] || []).forEach((cb) => cb({ docs }));
}
const localDb = {
  collection(col) {
    return {
      doc(id) {
        const did = id || newId();
        return {
          id: did,
          async set(data) { const v = JSON.parse(JSON.stringify(data)); try { await idbReq(col, 'readwrite', (s) => s.put(v, did)); } catch (e) { throw wrapErr(e); } MEM[col].set(did, v); emit(col); },
          async update(data) {
            const cur = MEM[col].get(did); if (!cur) throw { code: 'missing' };
            const v = { ...cur, ...JSON.parse(JSON.stringify(data)) };
            try { await idbReq(col, 'readwrite', (s) => s.put(v, did)); } catch (e) { throw wrapErr(e); } MEM[col].set(did, v); emit(col);
          },
          async delete() { await idbReq(col, 'readwrite', (s) => s.delete(did)); MEM[col].delete(did); emit(col); },
        };
      },
    };
  },
};
const localAssets = {
  async upload(blob, opts) {
    const type = (opts && opts.type) || blob.type || 'application/octet-stream';
    const b = blob.type === type ? blob : new Blob([blob], { type });
    const id = newId();
    try { await idbReq('assets', 'readwrite', (s) => s.put({ blob: b, type, created: Date.now() }, id)); } catch (e) { throw wrapErr(e); }
    URLS.set(id, URL.createObjectURL(b));
    return { id, url: URLS.get(id) };
  },
  async delete(id) {
    await idbReq('assets', 'readwrite', (s) => s.delete(id));
    const u = URLS.get(id); if (u) URL.revokeObjectURL(u); URLS.delete(id);
  },
};
async function initData() {
  try { IDB = await idbOpen(); } catch (e) { S.noDb = true; render(); return; }
  try {
    for (const col of Object.values(COLS)) MEM[col] = new Map(await idbEntries(col));
    for (const [id, v] of await idbEntries('assets')) if (v && v.blob) URLS.set(id, URL.createObjectURL(v.blob));
    if (!lsGet('pi_seeded') && MEM.lib_sections.size === 0 && MEM.lib_docs.size === 0) {
      for (const [col, list] of Object.entries(SEED)) for (const rec of list) { const { id, ...rest } = rec; await idbReq(col, 'readwrite', (s) => s.put(rest, id)); MEM[col].set(id, rest); }
      lsSet('pi_seeded', '1');
    }
  } catch (e) { S.noDb = true; render(); return; }
  S.db = localDb; S.assets = localAssets;
  for (const [key, col] of Object.entries(COLS)) {
    LIS[col] = [(snap) => { S[key] = snap.docs.map((d) => ({ id: d.id, ...d.data() })); S.loaded[key] = true; render(); }];
    emit(col);
  }

}

// ---------- Sharing and saving files ----------
async function shareFile(blob, fname, title) {
  const file = new File([blob], fname, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title }); return true; }
    catch (e) { if (e && e.name === 'AbortError') return false; }
  }
  toast('Udostępnianie nie jest dostępne na tym urządzeniu. Użyj „Zapisz w telefonie”.');
  return false;
}
function downloadFile(blob, fname) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
}
function fileReady(title, fname, blob, lead, note) {
  openSheet(`<h2>${esc(title)}</h2><p class="lead">${esc(fname)} · ${(blob.size / 1048576).toFixed(1)} MB${lead ? ' · ' + esc(lead) : ''}</p>
    ${note ? `<div class="note" style="margin-bottom:14px">${note}</div>` : ''}
    <div class="actions"><button class="btn" type="button" id="fSaveFile">${ICON.report} Zapisz w telefonie</button><button class="btn accent" type="button" id="fShare">${ICON.share} Udostępnij</button></div>`, (el) => {
    $('#fShare', el).onclick = () => shareFile(blob, fname, title);

  });
}

// ---------- Backup & restore ----------
async function createBackup() {
  try {
    busy(true, 'Tworzenie kopii', 'Zbieranie danych…', 0.05);
    const collections = {};
    for (const col of Object.values(COLS)) collections[col] = [...MEM[col].entries()].map(([id, data]) => ({ id, ...data }));
    const assets = await idbEntries('assets');
    const files = [{ name: 'data.json', blob: new Blob([JSON.stringify({ app: 'pomocnik-inzyniera', format: 1, version: APP_VERSION, exportedAt: new Date().toISOString(), collections, assets: assets.map(([id, v]) => ({ id, type: v.type })) })], { type: 'application/json' }) }];
    for (const [id, v] of assets) files.push({ name: 'assets/' + id, blob: v.blob });
    const zip = await makeZip(files, (i, n) => busy(true, 'Tworzenie kopii', `Plik ${i} z ${n}`, 0.1 + 0.85 * i / n));
    busy(false);
    lsSet('pi_lastBackup', Date.now());
    const d = new Date(); const stamp = d.toISOString().slice(0, 10) + '_' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
    fileReady('Kopia zapasowa gotowa', `Pomocnik_kopia_${stamp}.zip`, zip, `${files.length - 1} ${plural(files.length - 1, 'plik', 'pliki', 'plików')}`,
      'Zapisz kopię poza telefonem: najlepiej „Udostępnij” → Dysk Google albo wyślij sobie e-mailem. Przywrócisz ją w Ustawieniach.');
    if (S.route.name === 'projects') render();
  } catch (e) { busy(false); toast('Nie udało się utworzyć kopii.'); console.error(e); }
}
async function restoreBackup(file) {
  if (!(await askConfirm('Przywrócić kopię?', 'Wszystkie obecne dane w aplikacji zostaną zastąpione danymi z pliku kopii.', 'Przywróć', true))) return;
  try {
    busy(true, 'Przywracanie kopii', file.name, 0.05);
    const entries = await readZip(file);
    const dj = entries.get('data.json'); if (!dj) throw new Error('format');
    const data = JSON.parse(await (await dj.blob('application/json')).text());
    if (data.app !== 'pomocnik-inzyniera') throw new Error('format');
    for (const st of [...Object.values(COLS), 'assets']) await idbReq(st, 'readwrite', (s) => s.clear());
    for (const u of URLS.values()) URL.revokeObjectURL(u); URLS.clear();
    for (const col of Object.values(COLS)) MEM[col] = new Map();
    const list = data.assets || [];
    for (let i = 0; i < list.length; i++) {
      const a = list[i]; const e = entries.get('assets/' + a.id); if (!e) continue;
      const b = await e.blob(a.type);
      await idbReq('assets', 'readwrite', (s) => s.put({ blob: b, type: a.type, created: Date.now() }, a.id));
      URLS.set(a.id, URL.createObjectURL(b));
      busy(true, 'Przywracanie kopii', `Plik ${i + 1} z ${list.length}`, 0.1 + 0.8 * (i + 1) / list.length);
    }
    for (const col of Object.values(COLS)) for (const rec of (data.collections || {})[col] || []) {
      const { id, ...rest } = rec; await idbReq(col, 'readwrite', (s) => s.put(rest, id)); MEM[col].set(id, rest);
    }
    lsSet('pi_seeded', '1');
    busy(false); closeSheet();
    for (const col of Object.values(COLS)) emit(col);
    navigate({ name: 'lib' }); toast('Przywrócono dane z kopii');
  } catch (e) {
    busy(false); toast(e && e.name === 'QuotaExceededError' ? dbErr({ code: 'quota' }) : 'To nie jest prawidłowy plik kopii Pomocnika Inżyniera.'); console.error(e);
  }
}

// ---------- Image helpers ----------
async function decodeImage(file) {
  try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) {}
  return await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
}
async function toJpeg(file, maxDim, q = 0.85) {
  const img = await decodeImage(file);
  const w0 = img.width, h0 = img.height; const k = Math.min(1, maxDim / Math.max(w0, h0));
  const w = Math.round(w0 * k), h = Math.round(h0 * k);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
  const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', q));
  return { blob, w, h };
}
function loadImg(src) {
  return new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
}
async function pdfToImages(file, onProgress) {
  const pdfjsLib = await ensurePdfJs();
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const out = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    onProgress && onProgress(i, pdf.numPages);
    const page = await pdf.getPage(i);
    const v1 = page.getViewport({ scale: 1 });
    const scale = Math.min(4, 2800 / Math.max(v1.width, v1.height));
    const vp = page.getViewport({ scale });
    const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: g, viewport: vp }).promise;
    const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.9));
    out.push({ blob, w: c.width, h: c.height });
    c.width = c.height = 1; // free memory on phones
  }
  return out;
}

function sectionPath(id) {
  const out = []; let cur = S.sections.find((s) => s.id === id); let guard = 0;
  while (cur && guard++ < 20) { out.unshift(cur); cur = S.sections.find((s) => s.id === cur.parent); }
  return out;
}
function descendantIds(id) {
  const out = new Set([id]); let added = true;
  while (added) { added = false; for (const s of S.sections) if (s.parent && out.has(s.parent) && !out.has(s.id)) { out.add(s.id); added = true; } }
  return out;
}
function docCount(id) { const ids = descendantIds(id); return S.docs.filter((d) => ids.has(d.section)).length; }
function hl(text, terms) {
  let html = esc(text); if (!terms.length) return html;
  // Highlight on folded text by mapping positions (same length for Polish letters after folding).
  const f = fold(text); const marks = [];
  for (const t of terms) { let i = f.indexOf(t); while (i >= 0 && t) { marks.push([i, i + t.length]); i = f.indexOf(t, i + t.length); } }
  if (!marks.length || f.length !== String(text).length) return html;
  marks.sort((a, b) => a[0] - b[0]); const merged = [];
  for (const m of marks) { const l = merged[merged.length - 1]; if (l && m[0] <= l[1]) l[1] = Math.max(l[1], m[1]); else merged.push([...m]); }
  let res = '', p = 0; const s = String(text);
  for (const [a, b] of merged) { res += esc(s.slice(p, a)) + '<mark>' + esc(s.slice(a, b)) + '</mark>'; p = b; }
  return res + esc(s.slice(p));
}
function docRow(d, terms = [], extra = '') {
  const meta = [];
  const path = sectionPath(d.section).map((s) => s.name).join(' › ');
  if (path) meta.push(esc(path));
  if (d.asset) meta.push('PDF');
  if ((d.chapters || []).length) meta.push((d.chapters.length) + ' rozdz.');
  return `<button class="item" type="button" data-act="open-doc" data-id="${d.id}">
    <span class="type ${esc(d.type || 'INNE')}">${esc(TYPE_SHORT[d.type] || 'INNE')}</span>
    <span class="body">${d.number ? `<span class="desig">${hl(d.number, terms)}</span>` : ''}
      <div class="t">${hl(d.title || 'Bez tytułu', terms)}</div>
      <div class="m">${meta.join(' · ')}</div>${extra}</span>
    <span class="chev">${ICON.chev}</span></button>`;
}

function libSearch(q) {
  const terms = fold(q).split(/\s+/).filter(Boolean);
  const res = [];
  for (const d of S.docs) {
    const head = fold([d.number, d.title, d.notes, d.tags].join(' '));
    const chHits = (d.chapters || []).filter((c) => { const t = fold([c.no, c.title, c.notes, c.quote].join(' ')); return terms.every((w) => t.includes(w) || head.includes(w)) && terms.some((w) => t.includes(w)); });
    const headOk = terms.every((w) => head.includes(w));
    if (headOk || chHits.length) res.push({ d, chHits, score: (headOk ? 2 : 0) + (fold(d.number).includes(terms[0]) ? 3 : 0) });
  }
  res.sort((a, b) => b.score - a.score || byNumber(a.d, b.d));
  if (!res.length) return `<div class="empty" style="margin-top:14px"><h3>Brak wyników</h3><p>Nic nie pasuje do „${esc(q)}”. Szukam w numerach, tytułach, notatkach i rozdziałach.</p></div>`;
  return `<div class="label"><span>Wyniki</span><span class="count">${res.length}</span></div><div class="list">` +
    res.map(({ d, chHits }) => docRow(d, terms, chHits.length ? `<ul class="hits">${chHits.slice(0, 4).map((c) => `<li>§ ${hl([c.no, c.title].filter(Boolean).join(' '), terms)}${c.page ? ` · s. ${esc(c.page)}` : ''}</li>`).join('')}</ul>` : '')).join('') + `</div>`;
}

function sectionOptions(selected, excludeId) {
  const excl = excludeId ? descendantIds(excludeId) : new Set();
  const out = [`<option value="">— Biblioteka (główny poziom) —</option>`];
  const walk = (parent, depth) => {
    for (const s of S.sections.filter((x) => (x.parent || null) === parent).sort(byName)) {
      if (excl.has(s.id)) continue;
      out.push(`<option value="${s.id}" ${s.id === selected ? 'selected' : ''}>${'  '.repeat(depth)}${depth ? '└ ' : ''}${esc(s.name)}</option>`);
      walk(s.id, depth + 1);
    }
  };
  walk(null, 0); return out.join('');
}

// ---------------- PHOTO ANNOTATOR ----------------
function openAnnotator(src) {
  return new Promise(async (resolve) => {
    const ov = document.createElement('div'); ov.id = 'annot'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', 'Rysowanie na zdjęciu');
    ov.innerHTML = `<div class="abar">
        <button class="abtn" type="button" data-a="cancel">Anuluj</button><span class="sp"></span>
        <button class="abtn" type="button" data-a="undo">Cofnij</button>
        <button class="abtn save" type="button" data-a="save">Zapisz</button></div>
      <div class="acv"><canvas aria-label="Zdjęcie do oznaczenia"></canvas></div>
      <div class="abar">
        <button class="abtn" type="button" data-tool="arrow" aria-pressed="true">↗ Strzałka</button>
        <button class="abtn" type="button" data-tool="circle" aria-pressed="false">◯ Kółko</button>
        <button class="abtn" type="button" data-tool="pen" aria-pressed="false">✎ Pisak</button><span class="sp"></span>
        <button class="sw" type="button" data-color="#e53935" aria-label="Czerwony" aria-pressed="true" style="background:#e53935"></button>
        <button class="sw" type="button" data-color="#ffd400" aria-label="Żółty" aria-pressed="false" style="background:#ffd400"></button>
        <button class="sw" type="button" data-color="#ffffff" aria-label="Biały" aria-pressed="false" style="background:#ffffff"></button></div>`;
    document.body.appendChild(ov); document.body.classList.add('locked');
    const finish = (val) => { ov.remove(); if ($('#sheet').hidden) document.body.classList.remove('locked'); resolve(val); };
    const img = await loadImg(src);
    if (!img) { toast('Nie udało się wczytać zdjęcia.'); finish(null); return; }
    const c = $('canvas', ov); c.width = img.naturalWidth; c.height = img.naturalHeight; const g = c.getContext('2d');
    const lw = Math.max(4, Math.round(Math.max(c.width, c.height) / 170));
    let tool = 'arrow', color = '#e53935', cur = null; const shapes = [];
    const drawShape = (sh) => {
      g.save(); g.strokeStyle = sh.color; g.fillStyle = sh.color; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round';
      g.shadowColor = 'rgba(0,0,0,.5)'; g.shadowBlur = lw * 1.2;
      const [a, b] = [sh.pts[0], sh.pts[sh.pts.length - 1]];
      g.beginPath();
      if (sh.type === 'arrow') {
        const ang = Math.atan2(b.y - a.y, b.x - a.x), hl = lw * 4.5;
        g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
        g.beginPath(); g.moveTo(b.x, b.y);
        g.lineTo(b.x - hl * Math.cos(ang - 0.45), b.y - hl * Math.sin(ang - 0.45));
        g.lineTo(b.x - hl * Math.cos(ang + 0.45), b.y - hl * Math.sin(ang + 0.45)); g.closePath(); g.fill();
      } else if (sh.type === 'circle') {
        g.ellipse((a.x + b.x) / 2, (a.y + b.y) / 2, Math.max(2, Math.abs(b.x - a.x) / 2), Math.max(2, Math.abs(b.y - a.y) / 2), 0, 0, Math.PI * 2); g.stroke();
      } else {
        sh.pts.forEach((q, k) => (k ? g.lineTo(q.x, q.y) : g.moveTo(q.x, q.y))); g.stroke();
      }
      g.restore();
    };
    const redraw = () => { g.drawImage(img, 0, 0); shapes.forEach(drawShape); if (cur) drawShape(cur); };
    redraw();
    const pos = (e) => { const r = c.getBoundingClientRect(); return { x: (e.clientX - r.left) * c.width / r.width, y: (e.clientY - r.top) * c.height / r.height }; };
    c.addEventListener('pointerdown', (e) => { c.setPointerCapture(e.pointerId); cur = { type: tool, color, pts: [pos(e)] }; });
    c.addEventListener('pointermove', (e) => { if (!cur) return; const q = pos(e); if (tool === 'pen') cur.pts.push(q); else cur.pts[1] = q; redraw(); });
    const up = () => { if (cur && cur.pts.length > 1) shapes.push(cur); cur = null; redraw(); };
    c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
    ov.addEventListener('click', (e) => {
      const t = e.target.closest('[data-tool]'), co = e.target.closest('[data-color]'), a = e.target.closest('[data-a]');
      if (t) { tool = t.dataset.tool; ov.querySelectorAll('[data-tool]').forEach((x) => x.setAttribute('aria-pressed', String(x === t))); }
      if (co) { color = co.dataset.color; ov.querySelectorAll('[data-color]').forEach((x) => x.setAttribute('aria-pressed', String(x === co))); }
      if (!a) return;
      if (a.dataset.a === 'undo') { shapes.pop(); redraw(); }
      if (a.dataset.a === 'cancel') finish(null);
      if (a.dataset.a === 'save') {
        if (!shapes.length) { finish(null); return; }
        c.toBlob((b) => finish(b), 'image/jpeg', 0.86);
      }
    });
  });
}

// PDF REPORT (drawn on A4 canvases → JPEG pages → MiniPdf → share / save)
// =====================================================================
const A4 = { w: 1240, h: 1754, m: 80 };
const RC = { ink: '#17222b', muted: '#5b6a72', line: '#c9d2d4', accent: '#e5a019', ok: '#3fae6c', soft: '#f1f4f3' };
function font(g, weight, size, fam) { g.font = `${weight} ${size}px ${fam === 'mono' ? '"JetBrains Mono", monospace' : fam === 'cond' ? '"Barlow Condensed", "Arial Narrow", sans-serif' : 'Barlow, Arial, sans-serif'}`; }
function wrap(g, text, maxW) {
  const out = [];
  for (const para of String(text || '').split('\n')) {
    let line = '';
    for (const word of para.split(/\s+/)) {
      const t = line ? line + ' ' + word : word;
      if (g.measureText(t).width > maxW && line) { out.push(line); line = word; } else line = t;
    }
    out.push(line);
  }
  return out;
}
function drawContain(g, img, x, y, w, h, crop) {
  const sx = crop ? crop.x : 0, sy = crop ? crop.y : 0, sw = crop ? crop.w : img.width, sh = crop ? crop.h : img.height;
  const k = Math.min(w / sw, h / sh); const dw = sw * k, dh = sh * k; const dx = x + (w - dw) / 2, dy = y + (h - dh) / 2;
  g.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh); return { dx, dy, k };
}
function drawPin(g, x, y, n, done, r = 22) {
  g.save(); g.translate(x, y);
  g.beginPath(); g.moveTo(0, 0); g.bezierCurveTo(-r * 0.4, -r * 0.9, -r, -r * 1.2, -r, -r * 1.9); g.arc(0, -r * 1.9, r, Math.PI, 0); g.bezierCurveTo(r, -r * 1.2, r * 0.4, -r * 0.9, 0, 0); g.closePath();
  g.fillStyle = done ? RC.ok : RC.accent; g.fill(); g.lineWidth = 3; g.strokeStyle = '#1b1b1b'; g.stroke();
  font(g, 700, Math.round(r * 0.95), 'mono'); g.fillStyle = '#1b1b1b'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(n), 0, -r * 1.9 + 1);
  g.restore();
}
function pageFrame(g, p, title, i, n) {
  g.fillStyle = '#fff'; g.fillRect(0, 0, A4.w, A4.h);
  font(g, 600, 20, 'body'); g.fillStyle = RC.muted; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.fillText(title, A4.m, 56); g.textAlign = 'right'; g.fillText(fmtDate(p.date), A4.w - A4.m, 56);
  g.strokeStyle = RC.line; g.lineWidth = 2; g.beginPath(); g.moveTo(A4.m, 70); g.lineTo(A4.w - A4.m, 70); g.stroke();
  g.beginPath(); g.moveTo(A4.m, A4.h - 66); g.lineTo(A4.w - A4.m, A4.h - 66); g.stroke();
  g.textAlign = 'left'; g.fillText('Pomocnik Inżyniera · ' + p.name, A4.m, A4.h - 36);
  g.textAlign = 'right'; g.fillText(`Strona ${i} z ${n}`, A4.w - A4.m, A4.h - 36);
}
function statusPill(g, x, y, done) {
  const t = done ? 'USUNIĘTA' : 'DO USUNIĘCIA'; font(g, 700, 18, 'body');
  const w = g.measureText(t).width + 24; g.fillStyle = done ? '#dff2e6' : '#fbecc9';
  g.beginPath(); g.roundRect ? g.roundRect(x - w, y - 24, w, 34, 17) : g.rect(x - w, y - 24, w, 34); g.fill();
  g.fillStyle = done ? '#226b42' : '#6b4a00'; g.textAlign = 'center'; g.fillText(t, x - w / 2, y); g.textAlign = 'left';
}

async function generateReport() {
  const p = curProject(); if (!p) return;
  const defs = projDefects(p.id).sort((a, b) => a.number - b.number);
  if (!defs.length) { toast('Brak usterek do raportu.'); return; }
  try {
    busy(true, 'Tworzenie raportu', 'Wczytywanie czcionek i zdjęć…', 0.05);
    await Promise.all(['600 20px Barlow', '700 30px "Barlow Condensed"', '700 18px "JetBrains Mono"', '400 20px Barlow'].map((f) => document.fonts.load(f, 'ąęłśżź').catch(() => {})));
    const plans = (p.plans || []);
    const planImg = {};
    for (const pl of plans) planImg[pl.id] = await loadImg(blobUrl(pl.asset));
    const photoImg = {};
    let done = 0; const allPh = defs.flatMap((d) => d.photos || []);
    for (const id of allPh) { photoImg[id] = await loadImg(blobUrl(id)); busy(true, 'Tworzenie raportu', `Zdjęcia ${++done} z ${allPh.length}`, 0.05 + 0.45 * done / allPh.length); }

    const pages = []; // each: (g, i, n) => void
    const planName = Object.fromEntries(plans.map((x) => [x.id, x.name]));
    const openN = defs.filter((d) => d.status !== 'done').length;

    // --- Cover + summary table (may continue on following pages) ---
    const rowH = 46; const firstTop = 760; const contTop = 140; const bottom = A4.h - 110;
    const rowsFirst = Math.floor((bottom - firstTop) / rowH); const rowsCont = Math.floor((bottom - contTop) / rowH);
    const chunks = [defs.slice(0, rowsFirst)]; for (let i = rowsFirst; i < defs.length; i += rowsCont) chunks.push(defs.slice(i, i + rowsCont));
    chunks.forEach((chunk, ci) => pages.push((g, i, n) => {
      pageFrame(g, p, 'Protokół odbioru lokalu – wykaz usterek', i, n);
      let top = contTop;
      if (ci === 0) {

        // Title block

        const x0 = A4.m, y0 = 290, cw = (A4.w - 2 * A4.m) / 2, ch = 104;
        g.strokeStyle = RC.ink; g.lineWidth = 3; g.strokeRect(x0, y0, cw * 2, ch * 3);
        g.lineWidth = 2; for (let r = 1; r < 3; r++) { g.beginPath(); g.moveTo(x0, y0 + ch * r); g.lineTo(x0 + cw * 2, y0 + ch * r); g.stroke(); }
        g.beginPath(); g.moveTo(x0 + cw, y0); g.lineTo(x0 + cw, y0 + ch * 3); g.stroke();
        tb.forEach(([k, v], idx) => {
          const cx = x0 + (idx % 2) * cw + 20, cy = y0 + Math.floor(idx / 2) * ch;
          font(g, 600, 17, 'body'); g.fillStyle = RC.muted; g.fillText(k.toUpperCase(), cx, cy + 34);
          font(g, 600, 25, 'body'); g.fillStyle = RC.ink; const lines = wrap(g, v || '—', cw - 40); g.fillText(lines[0] + (lines.length > 1 ? '…' : ''), cx, cy + 74);
        });
        font(g, 700, 30, 'cond'); g.fillStyle = RC.ink; g.fillText('Wykaz usterek', A4.m, 700);
        top = firstTop;
      }
      // Table header
      const cols = [A4.m, A4.m + 80, A4.m + 360, A4.m + 640, A4.w - A4.m];
      g.fillStyle = RC.soft; g.fillRect(A4.m, top - rowH + 8, A4.w - 2 * A4.m, rowH);
      font(g, 700, 17, 'body'); g.fillStyle = RC.muted;
      ['NR', 'POMIESZCZENIE', 'KATEGORIA', 'OPIS'].forEach((h, k) => g.fillText(h, cols[k] + 12, top - 8));
      chunk.forEach((d, r) => {
        const y = top + (r + 1) * rowH;
        g.strokeStyle = RC.line; g.lineWidth = 1; g.beginPath(); g.moveTo(A4.m, y + 8 - rowH); g.lineTo(A4.w - A4.m, y + 8 - rowH); g.stroke();
        font(g, 700, 19, 'mono'); g.fillStyle = d.status === 'done' ? '#226b42' : RC.ink; g.fillText(String(d.number), cols[0] + 12, y - 8);
        font(g, 500, 20, 'body'); g.fillStyle = RC.ink;
        const clip = (t, w) => { let s = String(t || '—'); if (g.measureText(s).width <= w) return s; while (s && g.measureText(s + '…').width > w) s = s.slice(0, -1); return s + '…'; };
        g.fillText(clip(d.room, 260), cols[1] + 12, y - 8);
        g.fillText(clip(d.category, 260), cols[2] + 12, y - 8);
        g.fillText(clip((d.status === 'done' ? '[usunięta] ' : '') + (d.description || ''), cols[4] - cols[3] - 24), cols[3] + 12, y - 8);
      });
    }));

    // --- Plan overview pages ---
    for (const pl of plans) {
      const ds = defs.filter((d) => d.plan === pl.id); const img = planImg[pl.id];
      if (!ds.length || !img) continue;
      pages.push((g, i, n) => {
        pageFrame(g, p, 'Rzut z oznaczeniem usterek', i, n);
        font(g, 700, 40, 'cond'); g.fillStyle = RC.ink; g.textAlign = 'left'; g.fillText(pl.name, A4.m, 140);
        font(g, 500, 20, 'body'); g.fillStyle = RC.muted; g.fillText(`${ds.length} ${plural(ds.length, 'usterka', 'usterki', 'usterek')} na tym rzucie`, A4.m, 172);
        const bx = A4.m, by = 200, bw = A4.w - 2 * A4.m, bh = A4.h - 300 - by + 20;
        g.strokeStyle = RC.line; g.lineWidth = 2; g.strokeRect(bx, by, bw, bh);
        const { dx, dy, k } = drawContain(g, img, bx + 10, by + 10, bw - 20, bh - 20);
        for (const d of ds) drawPin(g, dx + d.x * img.width * k, dy + d.y * img.height * k, d.number, d.status === 'done', 17);
      });
    }

    // --- Defect cards: flowing layout with all photos; rows break across pages ---
    const mc = document.createElement('canvas').getContext('2d'); // text measuring
    const TOP = 100, BOT = A4.h - 96, CW = A4.w - 2 * A4.m, GAP = 20, CELL_W = (CW - 2 * GAP) / 3, CELL_H = 300, ROW_H = CELL_H + 48;
    const flow = []; let ops = [], fy = TOP;
    const flush = () => { if (ops.length) flow.push(ops); ops = []; fy = TOP; };
    const place = (h, draw, keep = 0) => { if (fy + h + keep > BOT && ops.length) flush(); ops.push({ y: fy, draw }); fy += h; };
    const drawCardHead = (g, d, lines, y0) => {
      const x0 = A4.m;
      g.fillStyle = d.status === 'done' ? RC.ok : RC.accent; g.beginPath(); g.arc(x0 + 30, y0 + 46, 30, 0, Math.PI * 2); g.fill();
      g.lineWidth = 3; g.strokeStyle = '#1b1b1b'; g.stroke();
      font(g, 700, 26, 'mono'); g.fillStyle = '#1b1b1b'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(d.number), x0 + 30, y0 + 47);
      g.textAlign = 'left'; g.textBaseline = 'alphabetic';
      font(g, 700, 36, 'cond'); g.fillStyle = RC.ink; g.fillText(d.room || 'Bez lokalizacji', x0 + 80, y0 + 44);
      font(g, 500, 20, 'body'); g.fillStyle = RC.muted;
      g.fillText([d.category, planName[d.plan], d.createdAt ? 'zgł. ' + fmtDate(d.createdAt) : ''].filter(Boolean).join(' · '), x0 + 80, y0 + 76);
      statusPill(g, x0 + CW, y0 + 46, d.status === 'done');
      font(g, 400, 24, 'body'); g.fillStyle = RC.ink;
      lines.forEach((ln, li) => g.fillText(ln, x0, y0 + 124 + li * 33));
    };
    const drawCardRow = (g, d, row, y) => {
      row.forEach((cell, k) => {
        const x = A4.m + k * (CELL_W + GAP);
        g.strokeStyle = RC.line; g.lineWidth = 2;
        if (cell.kind === 'plan') {
          const img = planImg[d.plan]; g.fillStyle = '#fff'; g.fillRect(x, y, CELL_W, CELL_H);
          if (img) {
            const side = Math.max(img.width, img.height) * 0.28; const cx = d.x * img.width, cy = d.y * img.height;
            const crop = { w: Math.min(side, img.width), h: Math.min(side * CELL_H / CELL_W, img.height) };
            crop.x = Math.min(Math.max(0, cx - crop.w / 2), img.width - crop.w); crop.y = Math.min(Math.max(0, cy - crop.h / 2), img.height - crop.h);
            g.save(); g.beginPath(); g.rect(x, y, CELL_W, CELL_H); g.clip();
            const r = drawContain(g, img, x + 2, y + 2, CELL_W - 4, CELL_H - 4, crop);
            drawPin(g, r.dx + (cx - crop.x) * r.k, r.dy + (cy - crop.y) * r.k, d.number, d.status === 'done', 18); g.restore();
          }
          g.strokeRect(x, y, CELL_W, CELL_H);
          font(g, 600, 16, 'body'); g.fillStyle = RC.muted; g.fillText('LOKALIZACJA NA RZUCIE', x, y + CELL_H + 26);
        } else {
          const im = photoImg[cell.id]; g.fillStyle = RC.soft; g.fillRect(x, y, CELL_W, CELL_H);
          if (im) {
            // Contain-fit so annotations near the edges stay visible.
            g.save(); g.beginPath(); g.rect(x, y, CELL_W, CELL_H); g.clip(); drawContain(g, im, x, y, CELL_W, CELL_H); g.restore();
          }
          g.strokeRect(x, y, CELL_W, CELL_H);
          font(g, 600, 16, 'body'); g.fillStyle = RC.muted; g.fillText(`ZDJĘCIE ${cell.j + 1}`, x, y + CELL_H + 26);
        }
      });
    };
    for (const d of defs) {
      font(mc, 400, 24, 'body'); let lines = wrap(mc, d.description || '—', CW);
      if (lines.length > 24) { lines = lines.slice(0, 24); lines[23] += ' …'; }
      const headH = 104 + lines.length * 33 + 18;
      const cells = [{ kind: 'plan' }].concat((d.photos || []).map((id, j) => ({ kind: 'photo', id, j })));
      const rows = []; for (let k = 0; k < cells.length; k += 3) rows.push(cells.slice(k, k + 3));
      place(headH, (g, y) => drawCardHead(g, d, lines, y), ROW_H);
      rows.forEach((row) => place(ROW_H, (g, y) => drawCardRow(g, d, row, y)));
      place(44, (g, y) => { g.strokeStyle = RC.line; g.lineWidth = 2; g.setLineDash([10, 8]); g.beginPath(); g.moveTo(A4.m, y + 16); g.lineTo(A4.w - A4.m, y + 16); g.stroke(); g.setLineDash([]); });
    }
    // --- Legal note (art. 41 of the developer act) + signature boxes ---
    const LEGAL = 'Podstawa: art. 41 ustawy z dnia 20 maja 2021 r. o ochronie praw nabywcy lokalu mieszkalnego lub domu jednorodzinnego oraz Deweloperskim Funduszu Gwarancyjnym. '
      + 'Deweloper w terminie 14 dni od dnia podpisania protokołu przekazuje nabywcy, na papierze lub innym trwałym nośniku, potwierdzenie uznania wad albo oświadczenie o odmowie ich uznania wraz z uzasadnieniem. '
      + 'Brak odpowiedzi w tym terminie oznacza uznanie wad. Uznane wady deweloper usuwa w terminie 30 dni od dnia podpisania protokołu.';
    font(mc, 400, 21, 'body'); const legalLines = wrap(mc, LEGAL, CW);
    const sigH = 70 + legalLines.length * 30 + 60 + 190;
    place(sigH, (g, y) => {
      font(g, 700, 34, 'cond'); g.fillStyle = RC.ink; g.textAlign = 'left'; g.fillText('Ustalenia i podpisy', A4.m, y + 44);
      font(g, 400, 21, 'body'); g.fillStyle = RC.ink; legalLines.forEach((ln, k) => g.fillText(ln, A4.m, y + 86 + k * 30));
      const by = y + 86 + legalLines.length * 30 + 50; const bw = (CW - 2 * 30) / 3;
      [['Przedstawiciel dewelopera', p.developer], ['Nabywca', p.buyer], ['Odbierający', p.inspector]].forEach(([label, name], k) => {
        const x = A4.m + k * (bw + 30);
        font(g, 600, 17, 'body'); g.fillStyle = RC.muted; g.fillText(label.toUpperCase(), x, by);
        g.strokeStyle = RC.ink; g.lineWidth = 2; g.beginPath(); g.moveTo(x, by + 110); g.lineTo(x + bw, by + 110); g.stroke();
        font(g, 500, 19, 'body'); g.fillStyle = RC.ink; g.fillText(name || '', x, by + 140);
        font(g, 400, 16, 'body'); g.fillStyle = RC.muted; g.fillText('data i podpis', x, by + 166);
      });
    }, 0);
    flush();
    flow.forEach((pageOps) => pages.push((g, i, n) => { pageFrame(g, p, 'Karty usterek', i, n); for (const o of pageOps) o.draw(g, o.y); }));

    // --- Draw pages and assemble PDF ---
    const pdf = new MiniPdf();
    const c = document.createElement('canvas'); c.width = A4.w; c.height = A4.h; const g = c.getContext('2d');
    for (let i = 0; i < pages.length; i++) {
      busy(true, 'Tworzenie raportu', `Strona ${i + 1} z ${pages.length}`, 0.5 + 0.45 * (i / pages.length));
      g.save(); pages[i](g, i + 1, pages.length); g.restore();
      const jb = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.86));
      pdf.addJpeg(new Uint8Array(await jb.arrayBuffer()), c.width, c.height);
      await sleep(0);
    }
    const blob = pdf.toBlob();
    busy(false);
    const fname = `Odbior_${p.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l').replace(/Ł/g, 'L').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '')}_${p.date || today()}.pdf`;
    lastReport = { blob, fname };
    showReportReady(fname, pages.length);
  } catch (err) {
    busy(false); toast('Nie udało się utworzyć raportu. Spróbuj ponownie.'); console.error(err);
  }
}
let lastReport = null;
function showReportReady(fname, n) {
  fileReady('Raport gotowy', fname, lastReport.blob, `${n} ${plural(n, 'strona', 'strony', 'stron')}`,
    '„Udostępnij” wyśle raport prosto do WhatsAppa, Messengera, Gmaila lub na Dysk Google. „Zapisz w telefonie” zapisze go w folderze Pobrane.');
}

// =====================================================================
// EVENT DELEGATION
// =====================================================================
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'tab':
      if (el.dataset.tab === 'lib') navigate({ name: 'lib' }); else navigate({ name: 'projects' });
      break;
    case 'sheet-close': closeSheet(); break;
    case 'q-clear': S.query = ''; $('#q').value = ''; el.hidden = true; render(); break;
    case 'sec': S.libSection = id || null; S.query = ''; if ($('#q')) $('#q').value = ''; render(); window.scrollTo(0, 0); break;
    case 'sec-new': closeSheet(); openSectionForm(null); break;
    case 'sec-edit': openSectionForm(S.sections.find((s) => s.id === id)); break;
    case 'doc-new': closeSheet(); openDocForm(null); break;
    case 'lib-menu': openLibMenu(); break;
    case 'open-doc': navigate({ name: 'doc', id }); break;
    case 'back-lib': navigate({ name: 'lib' }); break;
    case 'doc-edit': openDocForm(S.docs.find((d) => d.id === id)); break;
    case 'pdf-open': openViewer(S.docs.find((d) => d.id === id), 1); break;
    case 'ch-new': openChapterForm(S.docs.find((d) => d.id === id), null); break;
    case 'ch-open': openChapterForm(S.docs.find((d) => d.id === id), el.dataset.ch); break;
    case 'ch-go': { const d = S.docs.find((x) => x.id === id); const c = d && (d.chapters || []).find((x) => x.id === el.dataset.ch); if (c) goToChapter(d, c); break; }
    case 'vm-toggle': toggleMarking(); break;
    case 'viewer-close': closeViewer(); break;
    case 'vz': zoomViewer(+el.dataset.z); break;
    case 'vs-toggle': toggleViewerSearch(); break;
    case 'vs-next': vsGo(VW.cur + 1); break;
    case 'vs-prev': vsGo(VW.cur - 1); break;
    case 'vs-go': vsGo(+el.dataset.k); break;
    case 'vs-list': { const l = $('#vsResults'); if (!VW.matches.length && l.hidden && !l.innerHTML) break; l.hidden = !l.hidden; el.setAttribute('aria-pressed', String(!l.hidden)); break; }
    case 'proj-new': openProjectForm(null); break;
    case 'proj-open': navigate({ name: 'project', id }); break;
    case 'proj-edit': openProjectForm(curProject()); break;
    case 'back-projects': navigate({ name: 'projects' }); break;
    case 'plan-new': openPlanForm(null); break;
    case 'plan-edit': openPlanForm(curPlan()); break;
    case 'plan-sel': { const pl = (curProject().plans || []).find((x) => x.id === id); setPlan(pl); render(); break; }
    case 'pz': { const st = $('#stage'); zoomAt(+el.dataset.z > 0 ? 1.4 : 1 / 1.4, st.clientWidth / 2, st.clientHeight / 2); break; }
    case 'pfit': fitPlan(); break;
    case 'add-mode': if (PV.moving) { PV.moving = null; PV.sel = null; } else PV.adding = !PV.adding; PV.ghost = null; render(); break;
    case 'dfilter': PV.filter = el.dataset.f; render(); break;
    case 'def-open': { const d = S.defects.find((x) => x.id === id); if (d) { window.scrollTo({ top: 0, behavior: 'smooth' }); openDefectForm(d); } break; }
    case 'report': generateReport(); break;
    case 'settings': openSettings(); break;
    case 'backup-now': createBackup(); break;
  }
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'docSearch') return;
  e.preventDefault(); const inp = $('#docQ'); const d = S.docs.find((x) => x.id === inp.dataset.id);
  if (d && inp.value.trim()) openViewer(d, 1, inp.value.trim());
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (!$('#sheet').hidden) closeSheet(); else if (!$('#viewer').hidden) closeViewer(); } });

render();
initData();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('./sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) toast('Pobrano nową wersję aplikacji. Zamknij ją i otwórz ponownie.'); });
}
</script>
